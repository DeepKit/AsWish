name: build

# AsWish CI — self-hosted Windows runner with Delphi BDS 37.0.
# Why self-hosted: BDS is commercial software, cannot run on GitHub public
# runners.
#
# The build has no dependency on the private DeepBase repository: the two EHAI /
# HB type units it needed are vendored under vendor/deepbase-ehai and are on the
# dcc64 search path, so a clean clone of this repo builds standalone.
#
# DEEPBASE_HOME is set below only so the vendored-upstream drift gate can find
# DeepBase when the runner happens to have it; the compiler never reads it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}   # allow manual trigger from Actions tab

# Prevent concurrent runs on the same ref from racing on a single runner:
# a new push cancels the in-flight run for that ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deterministic gates (vendored-upstream drift / open-source export)
        env:
          BDS: d:\Program Files (x86)\Embarcadero\Studio\37.0
          DEEPBASE_HOME: D:\_Progs\02Business\DeepBase
        run: |
          python -X utf8 ..\tools\spw-gates\gate_ehai_vendor_drift.py
          if errorlevel 1 exit /b 1
          python -X utf8 ..\tools\spw-gates\gate_open_source_build.py
          if errorlevel 1 exit /b 1

      - name: Build main program (AsWish.exe)
        env:
          BDS: d:\Program Files (x86)\Embarcadero\Studio\37.0
          DEEPBASE_HOME: D:\_Progs\02Business\DeepBase
        run: .\_build.bat

      - name: Build CLI (AsWish.CLI.exe)
        env:
          BDS: d:\Program Files (x86)\Embarcadero\Studio\37.0
          DEEPBASE_HOME: D:\_Progs\02Business\DeepBase
        working-directory: cli
        run: .\_build_cli.bat

      - name: Build tests (AsWish.Tests.exe)
        env:
          BDS: d:\Program Files (x86)\Embarcadero\Studio\37.0
          DEEPBASE_HOME: D:\_Progs\02Business\DeepBase
        working-directory: tests
        run: .\_build_tests.bat

      - name: Run tests
        working-directory: tests
        run: .\AsWish.Tests.exe

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dunitx-results
          path: tests/dunitx-results.xml
          if-no-files-found: warn
