name: build

# AsWish CI — self-hosted Windows runner with Delphi BDS 37.0.
# Why self-hosted: BDS is commercial software, cannot run on GitHub public
# runners.
#
# The build has no dependency on the private DeepBase repository: the two EHAI /
# HB type units it needed are vendored under vendor/deepbase-ehai and are on the
# dcc64 search path, so a clean clone of this repo builds standalone.
#
# DEEPBASE_HOME is set below only so the vendored-upstream drift gate can find
# DeepBase when the runner happens to have it; the compiler never reads it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}   # allow manual trigger from Actions tab

# Prevent concurrent runs on the same ref from racing on a single runner:
# a new push cancels the in-flight run for that ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-flight gate check (verify manifest gate scripts exist)
        working-directory: ${{ github.workspace }}
        run: |
          python -X utf8 -c "import json, os, sys; m = json.load(open('spw-manifest.json', encoding='utf-8')); missing = [os.path.basename(arg) for g in m.get('gates', []) if g.get('required') for arg in g.get('command', []) if arg.endswith('.py') and not os.path.isfile(os.path.join('tools', 'spw-gates', os.path.basename(arg)))]; (print('Gate script missing in tools/spw-gates/:', missing) or sys.exit(1)) if missing else print('All required gate scripts present.')"

      - name: Run all SPW gates via in-repo runner (WO-20261004-0088)
        env:
          BDS: d:\Program Files (x86)\Embarcadero\Studio\37.0
          DEEPBASE_HOME: D:\_Progs\02Business\DeepBase
        working-directory: ${{ github.workspace }}
        run: |
          python -X utf8 tools\spw-gates\run_all_gates.py
          if errorlevel 1 exit /b 1

      - name: Build CLI (AsWish.CLI.exe)
        env:
          BDS: d:\Program Files (x86)\Embarcadero\Studio\37.0
          DEEPBASE_HOME: D:\_Progs\02Business\DeepBase
        working-directory: cli
        run: .\_build_cli.bat

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dunitx-results
          path: tests/dunitx-results.xml
          if-no-files-found: warn
